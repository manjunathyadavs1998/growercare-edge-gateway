# Runs the gateway as a container on the growercare-local-platform network (ADR-017).
#   1. growercare-local-platform: docker compose up -d --wait (and the services)
#   2. here: cp .env.example .env && mvn -B package jib:dockerBuild -DskipTests && docker compose up -d
services:
  edge-gateway:
    image: ghcr.io/manjunathyadavs1998/edge-gateway:${IMAGE_TAG:-1.0.0-SNAPSHOT}
    container_name: gc-edge
    env_file: .env                     # the ONLY configuration input (SPEC-PLAT-06 R77)
    ports:
      - "8080:8080"
    restart: unless-stopped

networks:
  default:
    name: growercare
    external: true
